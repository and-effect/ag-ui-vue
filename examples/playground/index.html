<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ag-ui-vue playground</title>
    <script>
      // Apply the theme before first paint to avoid a light flash in dark mode.
      try {
        const stored = localStorage.getItem('playground-theme')
        const dark =
          stored === 'dark' ||
          ((!stored || stored === 'auto') && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
