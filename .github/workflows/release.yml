name: Release

# Publishes to npm when a vX.Y.Z tag is pushed (see "Releasing" in
# CONTRIBUTING.md). Authenticates with npm trusted publishing (OIDC), so there
# is no NPM_TOKEN secret; npm attaches provenance automatically.
# TEMPORARY: the first publish (v0.5.0) uses an NPM_TOKEN, because npm only
# accepts a trusted publisher for a package that already exists. See the
# Publish step.
#
# Two jobs, so the OIDC token never shares a job with dependency code:
# `build` installs, tests and packs without the token; `publish` holds the
# token, installs nothing and only uploads the tarball `build` produced.
#
# Run it manually (Actions → Release → Run workflow) to rehearse a release:
# the same jobs, ending in `npm publish --dry-run`.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # No dependency cache when releasing: a cache written by another
          # workflow run must not be able to change what ends up on npm.
          package-manager-cache: false

      # The tag must match package.json, otherwise we'd publish a mislabelled
      # package. Fail before doing anything else.
      - name: Check tag matches package.json version
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "Tag $TAG does not match package.json version $PKG_VERSION"
            exit 1
          fi

      # No dependency needs its install scripts, so don't run any.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run build
      - run: npm run lint:package
      # Pack the dist/ that was just built and checked, without running scripts.
      - run: mkdir package && npm pack --ignore-scripts --pack-destination package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: package/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing and provenance
    steps:
      # Only .nvmrc, for the Node version. No project code runs in this job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .nvmrc
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
          # TEMPORARY, together with NODE_AUTH_TOKEN in the Publish step: writes
          # an .npmrc that reads NODE_AUTH_TOKEN. Remove both after the first publish.
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1. An older npm falls back to
      # token auth and fails with a confusing ENEEDAUTH, so fail clearly here.
      - name: Check npm version
        run: |
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number)
            const ok = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)))
            console.log(`npm ${process.argv[1]}`)
            if (!ok) { console.error("Trusted publishing needs npm >= 11.5.1"); process.exit(1) }
          ' "$(npm --version)"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: package

      # Publishing a tarball runs no lifecycle scripts.
      - name: Publish
        if: github.event_name == 'push'
        run: npm publish package/*.tgz --provenance --access public
        env:
          # TEMPORARY: only for the very first publish of v0.5.0.
          # Remove once the trusted publisher is configured on npmjs.com.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish (dry run)
        if: github.event_name == 'workflow_dispatch'
        run: npm publish package/*.tgz --dry-run --provenance --access public
